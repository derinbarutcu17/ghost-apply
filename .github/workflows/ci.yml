name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m venv /tmp/ghost-apply-install
      - run: /tmp/ghost-apply-install/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/ghost-apply-install/bin/python -c "import ghost_apply; print(ghost_apply.__version__)"

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check for obvious private artifacts
        run: python scripts/public_safety_scan.py --root .
