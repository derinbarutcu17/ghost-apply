name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m build
      - run: python -m venv /tmp/ghost-apply-install
      - run: /tmp/ghost-apply-install/bin/python -m pip install --no-deps dist/*.whl
      - run: /tmp/ghost-apply-install/bin/python -c "import ghost_apply; print(ghost_apply.__version__)"

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check for obvious private artifacts
        run: python scripts/public_safety_scan.py --root .
